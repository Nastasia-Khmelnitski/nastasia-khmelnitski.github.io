<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Toolkit</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --dark:#3A3A3C; --mid:#4A5248; --khaki:#6A726A; --sage:#A8A8A4;
    --cream:#F2F0EB; --white:#F8F7F4; --ink:#1C1C1E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--white);color:var(--ink);}

  nav{background:var(--dark);padding:14px 72px;display:flex;justify-content:flex-start;align-items:center;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.06);}
  .nav-home{font-size:11px;color:var(--sage);letter-spacing:2px;text-transform:uppercase;text-decoration:none;font-weight:600;display:flex;align-items:center;gap:8px;}
  .nav-home:hover{color:var(--cream);}

  .hero{background:var(--dark);padding:80px 72px 60px;min-height:60vh;display:flex;flex-direction:column;justify-content:flex-end;}
  .hero-label{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--sage);margin-bottom:20px;font-weight:500;}
  .hero h1{font-family:'DM Serif Display',serif;font-size:clamp(40px,6vw,72px);font-weight:400;line-height:1.0;color:var(--cream);margin-bottom:8px;}
  .hero h1 em{font-style:italic;color:var(--sage);}
  .hero-sub{font-size:13px;color:var(--sage);margin-bottom:36px;font-weight:300;}

  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;}
  .row-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--khaki);font-weight:600;width:100%;margin-bottom:6px;}

  #search{padding:10px 16px;border:1px solid var(--mid);background:rgba(255,255,255,0.05);color:var(--cream);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;width:220px;}
  #search::placeholder{color:var(--khaki);}
  #search:focus{border-color:var(--sage);}
  .toggle-group{display:flex;}
  .toggle-btn{padding:10px 18px;border:1px solid var(--mid);border-right:none;cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:transparent;color:var(--khaki);transition:all 0.12s;}
  .toggle-btn:last-child{border-right:1px solid var(--mid);}
  .toggle-btn.active{background:var(--sage);border-color:var(--sage);color:var(--dark);}
  .toggle-btn:hover:not(.active){color:var(--cream);}

  .arc-btn{padding:10px 20px;border:1px solid rgba(200,196,160,0.4);background:rgba(200,196,160,0.07);color:var(--sage);cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;transition:all 0.12s;}
  .arc-btn:hover{border-color:var(--sage);background:rgba(200,196,160,0.15);}
  .arc-btn.active{background:var(--sage);border-color:var(--sage);color:var(--dark);}

  .sit-btn{padding:7px 14px;border:1px solid var(--mid);background:transparent;color:var(--khaki);cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;transition:all 0.12s;}
  .sit-btn:hover{border-color:var(--sage);color:var(--sage);}
  .sit-btn.active{background:var(--sage);border-color:var(--sage);color:var(--dark);}

  .cat-btn{padding:7px 14px;border:1px solid rgba(168,168,164,0.3);background:transparent;color:var(--sage);cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;transition:all 0.12s;}
  .cat-btn:hover{border-color:var(--sage);color:var(--cream);}
  .cat-btn.active{background:var(--mid);border-color:var(--mid);color:var(--cream);}


  .lin-btn{padding:7px 14px;border:1px dashed rgba(74,82,72,0.5);background:transparent;color:var(--sage);cursor:pointer;font-size:10px;font-family:'DM Sans',sans-serif;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;transition:all 0.12s;}
  .lin-btn:hover{border-color:var(--sage);color:var(--cream);}
  .lin-btn.active{background:var(--mid);border-color:var(--mid);border-style:solid;color:var(--cream);}

  .stats-bar{background:var(--mid);padding:10px 72px;display:flex;gap:24px;align-items:center;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:var(--khaki);flex-wrap:wrap;}
  .stat-practiced{color:var(--sage);}
  .divider{width:1px;height:12px;background:var(--khaki);opacity:0.3;}

  .grid-area{padding:40px 72px;}
  .category-section{margin-bottom:52px;}
  .category-header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .cat-dot{width:6px;height:6px;background:var(--khaki);border-radius:50%;flex-shrink:0;}
  .cat-label-text{font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:600;color:var(--khaki);white-space:nowrap;}
  .cat-line{flex:1;height:1px;background:var(--cream);}
  .cat-count{font-size:10px;color:var(--sage);letter-spacing:1px;}
  .cat-sub{font-size:11px;color:var(--khaki);font-weight:300;font-style:italic;margin-bottom:18px;line-height:1.5;padding-left:20px;}
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px;}
  .card{background:var(--cream);padding:20px 20px 18px;transition:background 0.15s;border-top:2px solid transparent;display:flex;flex-direction:column;}
  .card:hover{background:#E8E6E0;border-top-color:var(--khaki);}
  .card.learning{background:var(--white);}
  .card.learning:hover{background:#EEECEA;border-top-color:var(--sage);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-name{font-family:'DM Serif Display',serif;font-size:15px;color:var(--dark);line-height:1.2;font-weight:400;flex:1;padding-right:8px;}
  .card-badge{font-size:13px;color:var(--sage);flex-shrink:0;}
  .card-note{font-size:11px;color:var(--khaki);margin-bottom:8px;line-height:1.5;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
  .card-desc{font-size:12px;color:var(--ink);margin-bottom:14px;line-height:1.6;font-weight:300;opacity:0.75;flex:1;}
  .card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;}
  .card-tag{font-size:9px;padding:3px 9px;font-weight:500;background:transparent;color:var(--khaki);border:1px solid var(--sage);letter-spacing:0.5px;}
  .card-tag.lineage{border-style:dashed;border-color:var(--mid);color:var(--mid);}
  .empty{padding:80px 40px;text-align:center;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--sage);font-weight:600;}

  .arc-view{background:var(--white);}
  .arc-hero{background:var(--dark);padding:48px 72px 40px;}
  .arc-hero h2{font-family:'DM Serif Display',serif;font-size:clamp(32px,5vw,56px);font-weight:400;color:var(--cream);line-height:1.0;}
  .arc-hero h2 em{font-style:italic;color:var(--sage);}
  .arc-hero p{font-size:12px;color:var(--sage);margin-top:12px;font-weight:300;}
  .arc-hero p.guide{font-size:11px;color:var(--khaki);margin-top:6px;font-style:italic;}
  .arc-content{padding:40px 72px;}
  .arc-phase-block{margin-bottom:44px;}
  .arc-phase-header{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .phase-num{font-family:'DM Serif Display',serif;font-size:36px;color:var(--cream);line-height:1;background:var(--mid);padding:4px 14px;flex-shrink:0;}
  .phase-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:600;color:var(--khaki);}
  .phase-line{flex:1;height:1px;background:var(--cream);}
  .arc-grid{display:grid;grid-template-columns:1fr;gap:2px;}
  @media(min-width:700px){.arc-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}}
  .arc-card{background:var(--cream);padding:20px 24px;transition:background 0.15s;display:flex;flex-direction:column;min-height:160px;}
  .arc-card:hover{background:#E8E6E0;}
  .arc-card.learning{background:var(--white);}
  .arc-card.learning:hover{background:#EEECEA;}
  .arc-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:12px;}
  .arc-card h3{font-family:'DM Serif Display',serif;font-size:15px;color:var(--dark);line-height:1.3;font-weight:400;flex:1;}
  .arc-note{font-size:12px;color:var(--sage);line-height:1.5;font-weight:300;}
  .arc-desc{font-size:11px;color:var(--ink);line-height:1.6;font-weight:300;opacity:0.7;margin-top:8px;}

  footer{background:var(--dark);padding:20px 72px;font-size:10px;color:var(--khaki);letter-spacing:2px;text-transform:uppercase;font-weight:500;border-top:2px solid var(--mid);}
  footer em{color:var(--sage);font-style:normal;}
</style>
</head>
<body>

<nav><a class="nav-home" href="/">◎ Home</a></nav>

<div class="hero">
  <div class="hero-label">Methods &amp; Craft Reference</div>
  <h1>My<br><em>Coaching</em><br>Toolkit</h1>
  <div class="hero-sub">Topics file a method, arcs sequence it. Filterable by topic, category, and lineage.</div>

  <div class="row" style="margin-bottom:20px;">
    <input type="text" id="search" placeholder="Search..." oninput="render()">
    <div class="toggle-group">
      <button class="toggle-btn active" onclick="setStatus('all',this)">All</button>
      <button class="toggle-btn" onclick="setStatus('practiced',this)">✓ Practiced</button>
      <button class="toggle-btn" onclick="setStatus('learning',this)">◎ Learning</button>
    </div>
  </div>

  <div class="row">
    <span class="row-label">Coaching Arcs</span>
    <button class="arc-btn" data-arc="career" onclick="setArc('career',this)">Finding Direction</button>
    <button class="arc-btn" data-arc="life" onclick="setArc('life',this)">Restoring Balance</button>
    <button class="arc-btn" data-arc="changeDecisions" onclick="setArc('changeDecisions',this)">Navigating Change</button>
    <button class="arc-btn" data-arc="conflict" onclick="setArc('conflict',this)">Working Through Conflict</button>
    <button class="arc-btn" data-arc="leadership" onclick="setArc('leadership',this)">Building Authority</button>
  </div>

  <div class="row">
    <span class="row-label">Topics</span>
    <div id="sit-filters" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
  </div>

  <div class="row">
    <span class="row-label">Lineage</span>
    <button class="lin-btn" data-lin="Narrative" onclick="setLin('Narrative',this)">Narrative</button>
    <button class="lin-btn" data-lin="Gestalt" onclick="setLin('Gestalt',this)">Gestalt</button>
  </div>

  <div class="row">
    <span class="row-label">Category</span>
    <button class="cat-btn" data-cat="Process" onclick="setCat('Process',this)">Process</button>
    <button class="cat-btn" data-cat="Tools" onclick="setCat('Tools',this)">Tools</button>
    <button class="cat-btn" data-cat="Approaches" onclick="setCat('Approaches',this)">Approaches</button>
    <button class="cat-btn" data-cat="Session Structures" onclick="setCat('Session Structures',this)">Session Structures</button>
  </div>

</div>

<div class="stats-bar" id="stats"></div>
<div id="main-view"><div class="grid-area" id="grid"></div></div>
<div id="arc-view" class="arc-view" style="display:none"></div>

<footer><em>Nastasia Khmelnitski &mdash; Coach for Creatives, Artists &amp; Business Professionals</em></footer>

<script>
// category: Process | Tools | Approaches | Session Structures | Method
// topic: single home (Method only). Craft layer uses topic:""
const methods = [

  // ================= CRAFT LAYER — PROCESS =================
  {name:"PESO",category:"Process",practiced:true,topic:"",note:"Session opening structure",desc:"Problem, Explanation, Solution Attempts, Objectives. Surfaces what the client brings, what they have tried, and what they want from the session."},
  {name:"Systemic Questions",category:"Process",practiced:true,topic:"",note:"Circular, scaling, hypothetical questions",desc:"A family of question types that shift perspective, reveal patterns, and open new thinking without the coach giving advice."},
  {name:"Systemic Triple Jump",category:"Process",practiced:true,topic:"",note:"Observation, explanation, evaluation",desc:"The systemic sequence: first what was observed, then how it is explained, then how it is evaluated. Separating the three reveals where the client has collapsed observation into judgment."},
  {name:"Narrative Triple Jump",lineage:"Narrative",category:"Process",practiced:true,topic:"",note:"Action, description, emotion",desc:"The narrative counterpart to the systemic triple jump, staying entirely in observation. Action: what did you do, what was said. Description: what you see, smell, hear, touch. Emotion: what you feel and where it sits in the body."},
  {name:"Somatic Observation",category:"Process",practiced:true,topic:"",note:"Name what you observe in body and posture",desc:"The coach notices and names what they observe in the client's body. The body often knows before the mind does."},
  {name:"Verbalising Emotions",category:"Process",practiced:true,topic:"",note:"Names the emotion the client has not yet named",desc:"The coach names or reflects the emotion they sense in the client. Brings emotional awareness into the conversation and validates the client's inner experience."},
  {name:"Hard Questions",category:"Process",practiced:true,topic:"",note:"Assumption challengers, fear naming, cost of avoidance",desc:"Question types designed to create productive discomfort: challenging assumptions, naming fears, confronting values, and asking what staying stuck is costing the client."},
  {name:"Paraphrasing",category:"Process",practiced:true,topic:"",note:"Reflective listening that confirms understanding",desc:"Restating what the client has said in your own words. Helps the client hear themselves differently and often opens new awareness."},
  {name:"Summarising",category:"Process",practiced:true,topic:"",note:"Condenses themes into the shape of the thinking",desc:"Restating the key themes of what the client has shared. Confirms the coach has followed accurately and helps the client see patterns across what they have said."},
  {name:"Reframing",category:"Process",practiced:true,topic:"",note:"Offers the same situation from a different angle",desc:"Offering the same situation with a different meaning or perspective. Not correcting the client, but opening a new way of seeing that makes different action possible."},
  {name:"Head / Heart / Hand",category:"Process",practiced:true,topic:"",note:"Session closing across three dimensions",desc:"The session closing structure. Head: what cognitive insight does the client take away. Heart: what do they feel. Hand: what is their concrete next step. Anchors every session before closing."},
  {name:"Meta Perspective",category:"Process",practiced:true,topic:"",note:"Stepping outside to observe the whole",desc:"The client steps into an observer position and looks at their inner figures or the whole situation from the outside. Creates distance and allows a more integrated view."},
  {name:"Explain vs. Tell",lineage:"Narrative",category:"Process",practiced:false,topic:"",note:"The guiding question of narrative work",desc:"Am I telling or explaining? Narrative work keeps the story and its moral apart for as long as possible. When the client only tells, without generalising or evaluating, room opens for variation, experiment, and contact."},
  {name:"The Four A: Author / Actor / Agent / Activist",lineage:"Narrative",category:"Process",practiced:false,topic:"",note:"Attending to the aspects of storytelling",desc:"Stories do not exist without context. Author: who is telling it and who wrote it. Actor: who is the protagonist. Agent: who is it being told to. Activist: what is it being told for, and who is meant to change. Especially useful in moments of problem trance."},
  {name:"Three Zones of Learning",category:"Process",practiced:false,topic:"",note:"Comfort, growth, and panic zones",desc:"Distinguishes the comfort zone (safe but no growth), the growth zone (stretch and learning), and the panic zone (too much stress, no learning). Helps locate where the client is and recalibrate the challenge."},
  {name:"Push-Pull Coaching Continuum",category:"Process",practiced:false,topic:"",note:"Directive to non-directive coaching style",desc:"A continuum from pushing (directive, advice-giving, challenging) to pulling (non-directive, evoking the client's own answers). Helps the coach consciously choose where to sit depending on what the client needs."},

  // ================= CRAFT LAYER — TOOLS =================
  {name:"Breathing / Meditation",category:"Tools",practiced:true,topic:"",note:"Somatic regulation",desc:"Short breathing or mindfulness exercises used to ground the client at the start of a session, regulate strong emotion mid-session, or anchor a key insight before closing."},
  {name:"Whiteboard Visualisation",category:"Tools",practiced:true,topic:"",note:"Externalises thinking spatially",desc:"Drawing the client's situation, system, or options on a whiteboard externalises what is happening in their head, making patterns visible and giving both coach and client something to look at together."},
  {name:"Visualisation",category:"Tools",practiced:true,topic:"",note:"Eyes closed, inner imagery",desc:"Guided inner imagery with eyes closed. Distinct from whiteboard work: nothing is drawn, the image forms internally. Useful for accessing what the analytical mind cannot reach directly."},
  {name:"MetaFox Deep Cards",category:"Tools",practiced:false,topic:"",note:"52 image and question cards",desc:"Evocative image cards each paired with a coaching question, based on Kotter's change model. Used to open conversations, surface resistance, and set direction through imagery."},
  {name:"Zurich Resource Model Cards",category:"Tools",practiced:true,topic:"",note:"Picture card deck used within the ZRM arc",desc:"The physical picture cards that open the Zurich Resource Model sequence. The client selects an image intuitively rather than analytically, which becomes the starting point for the somatic marker and motto goal. Also usable standalone. Deliberate exception: Zurich appears twice, as this deck and as the full sequence under Life &amp; Mindfulness. The deck and the arc are reached for in different moments."},

  // ================= CRAFT LAYER — APPROACHES =================
  {name:"Systemic Coaching",category:"Approaches",practiced:true,topic:"",note:"The client is read through their system",desc:"Works with the client as part of a web of relationships, loyalties, and patterns rather than an isolated individual. Circular questioning, hypothesising, and attention to what the problem does for the system are its core moves."},
  {name:"Narrative Coaching",category:"Approaches",practiced:true,topic:"",note:"Attention to the what and how of the story",desc:"Focuses on the process of storytelling rather than the concern behind it. Do not ask why. Stay in the concrete moment, co-produce the story, use symbols and embodiment, and follow the energy. Awareness in the present is what creates choice."},
  {name:"Gestalt Theory",category:"Approaches",practiced:true,topic:"",note:"Dialogic, here and now, use of self",desc:"The problem is not stated, it emerges. The coach brings themselves in authentically, uses irritation kindly to go deeper, works with body resonance and the contact between coach and client. A session does not have to reach closure."},
  {name:"Conflict Facilitation",category:"Approaches",practiced:false,topic:"",note:"Coaching-based process for conflict between parties",desc:"Helps both parties access their own perspective, hear each other, and find a path forward. Not mediation. Uses coaching tools within a structured facilitation frame."},

  // ================= CRAFT LAYER — SESSION STRUCTURES =================
  {name:"GROW Model",category:"Session Structures",practiced:true,topic:"",note:"Most flexible session structure",desc:"Goal, Reality, Options, Way Forward. Guides a session from where the client is to where they want to go. Works for almost any topic."},
  {name:"CLEAR Model",category:"Session Structures",practiced:false,topic:"",note:"Deep emotional and transformational exploration",desc:"Contract, Listen, Explore, Action, Review. Moves through deep listening and exploration of beliefs and emotions. Strong for identity-level change."},
  {name:"OSCAR Model",category:"Session Structures",practiced:false,topic:"",note:"Adds review loop, outcome-focused",desc:"Outcome, Situation, Choices, Actions, Review. Starts with the desired outcome before exploring the current situation. The built-in review step suits long-term work."},
  {name:"GREAT Model",category:"Session Structures",practiced:false,topic:"",note:"Adds timing as a strategic step",desc:"Goal, Reality, Explore, Action, Timing. Like GROW but adds Timing as a dedicated step, for when the challenge is not what to do but when and in what order."},
  {name:"Theory U",category:"Session Structures",practiced:false,topic:"",note:"Five movements down and up the U",desc:"Otto Scharmer's model of transformation through five stages: co-initiating, co-sensing, presencing, crystallizing, co-creating. Each layer goes deeper. Cynicism blocks the head, fear blocks the heart, ego blocks the will."},
  {name:"Solution-Focused Approach",category:"Session Structures",practiced:true,topic:"",note:"Build on exceptions, not problems",desc:"Adapted from de Shazer by Meier and Szabo. Focuses on exceptions (when is the problem not happening?), small steps forward, and what is already working, rather than analysing the problem in depth."},
  {name:"Problem-Oriented Approach",category:"Session Structures",practiced:false,topic:"",note:"Explores the function of the problem",desc:"Richard Fisch's systemic approach. Examines not just the problem but what function it serves in the client's system, and which attempted solutions have paradoxically maintained it."},

  // ================= METHODS — CAREER & BUSINESS =================
  {name:"Sweet Spot Analysis",category:"Method",practiced:false,topic:"Career",note:"Intersection of skill, passion, and value",desc:"Identifies the intersection of what the client is good at, what they love doing, and what the world needs or will pay for. The overlap is the direction for sustainable motivated work."},
  {name:"The Golden Circle: The Why",category:"Method",practiced:false,topic:"Career",note:"Why, how, what — purpose before action",desc:"Simon Sinek's model distinguishing what a person or organisation does, how they do it, and why. Inspiring leaders communicate from the Why outward. Used to help clients articulate their purpose and lead from it."},
  {name:"Career Framework",category:"Method",practiced:false,topic:"Career",note:"From personal story to leadership purpose",desc:"Based on Craig and Snook. Guides the client to identify their leadership purpose from their life story, translating key themes into a purpose statement that informs career direction."},
  {name:"The Business as a Separate Entity",category:"Method",practiced:false,topic:"Career",note:"Treats the business as its own living thing",desc:"The client takes a perspective outside themselves to see their business as something separate they are in relationship with, not an extension of themselves. Opens systemic and strategic insight."},
  {name:"Skill Stacking",category:"Method",practiced:false,topic:"Career",note:"Combining skills into a rare mix",desc:"Rather than being best at one skill, the client identifies several they are above average at and considers how combining them creates a rare, valuable position."},
  {name:"Talent Exercise",category:"Method",practiced:false,topic:"Career",note:"Surfaces unrecognised talents",desc:"Based on Rappe-Giesecke. A structured reflection helping the client identify talents they take for granted. Often reveals the gap between self-perception and actual capability."},

  // ================= METHODS — TEAMS & LEADERSHIP =================
  {name:"Three Sides of the Organisation",category:"Method",practiced:false,topic:"Leadership",note:"Formal, informal, and shadow structures",desc:"Examines an organisation through three lenses: the formal structure (what is supposed to happen), the informal structure (what actually happens), and the shadow side (what drives everything but is never spoken)."},
  {name:"Situational Leadership",category:"Method",practiced:false,topic:"Leadership",note:"Style adapts to development level",desc:"Based on Hersey and Blanchard. Four leadership styles (directing, coaching, supporting, delegating) matched to four levels of team member competence and commitment."},
  {name:"Leadership Maps",category:"Method",practiced:false,topic:"Leadership",note:"Maps stakeholders, power, and alliances",desc:"A visual method for mapping the client's leadership landscape: key stakeholders, power dynamics, alliances and resistances, and where the client sits in the system."},
  {name:"Role Model Reflection",category:"Method",practiced:false,topic:"Leadership",note:"Extracts implicit values via role models",desc:"The client names four to six role models, extracts key characteristics from each, and distils their top six. These become their implicit value system made explicit."},

  // ================= METHODS — ROLES & IDENTITY =================
  {name:"The Role Compass",category:"Method",practiced:false,topic:"Roles & Identity",note:"Expected, actual, desired, capable",desc:"Maps the client's role across four directions: what they are expected to do, what they actually do, what they want to do, and what they are capable of. The gaps are the coaching material."},
  {name:"The Role Analysis",category:"Method",practiced:false,topic:"Roles & Identity",note:"Clarifies role expectations and gaps",desc:"Maps the gap between what a role formally requires and what the client actually does. Useful when a client feels overwhelmed, underused, or in conflict with their environment."},
  {name:"The Role Expectations Scaling Analysis",category:"Method",practiced:false,topic:"Roles & Identity",note:"Scales expectations across stakeholders",desc:"Maps expectations from different stakeholders (manager, team, organisation, self) on a scale, revealing where the client is overloaded, misaligned, or working against competing demands."},
  {name:"Values Hierarchy Work",category:"Method",practiced:false,topic:"Roles & Identity",note:"Pairwise comparison reveals true priorities",desc:"The client selects values and compares each pair to identify which wins when forced to choose. The resulting hierarchy reveals the implicit priorities that drive real decisions."},
  {name:"Johari Window",category:"Method",practiced:false,topic:"Roles & Identity",note:"Known and unknown aspects of self",desc:"Based on Luft and Ingham. Four quadrants mapping what is known to self and others (open), only to others (blind spot), only to self (hidden), and to neither (unknown). Expands self-awareness and builds trust."},
  {name:"Growth vs. Fixed Mindset",category:"Method",practiced:false,topic:"Roles & Identity",note:"Spot fixed mindset language, reframe effort",desc:"Based on Carol Dweck. Distinguishes believing ability is fixed from believing it can grow. Helps coaches hear limiting beliefs in the client's language and reframe effort as the path to mastery."},

  // ================= METHODS — LIFE & MINDFULNESS =================
  {name:"Position Determination with the Base Triad",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Person, profession, function",desc:"Based on Rappe-Giesecke. Examines three dimensions of professional identity: who the person is, what their profession means to them, and what function they perform. Clarifies where the tension sits."},
  {name:"Life Line",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Maps key life events on a timeline",desc:"The client draws a timeline marking highs, lows, and turning points. Reveals recurring patterns, resilience themes, and moments that shaped their current identity."},
  {name:"Wheel of Life",category:"Method",practiced:true,topic:"Life & Mindfulness",note:"Satisfaction across life domains",desc:"A visual circle divided into life areas. The client scores each area, revealing where energy is high or low and where coaching focus belongs."},
  {name:"Love, Freedom & Safety Triangle",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Three core needs behind life choices",desc:"Explores how decisions are shaped by the pull between love and connection, freedom and autonomy, and safety and security. When one need is sacrificed for another, dissatisfaction follows."},
  {name:"Zurich Resource Model",category:"Method",practiced:true,topic:"Life & Mindfulness",note:"An arc of steps, not a single exercise",desc:"A sequence rather than one method. The client moves from an image or picture card, through a somatic marker, to a resource-activating motto goal and finally to embodied practice. Reconnects the client with strengths that already exist but feel inaccessible in the stuck state. Deliberate exception: Zurich appears twice, as this sequence and as the card deck under Tools."},
  {name:"The Energy Audit",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Maps what gives and drains energy",desc:"The client reviews their regular activities, people, and commitments, marking each as energy-giving or energy-draining. Surfaces patterns invisible in day-to-day busyness."},
  {name:"5-4-3-2-1 Grounding",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Sensory grounding for overwhelm",desc:"The client names five things they see, four they hear, three they can touch, two they smell, and one they taste. Brings an anxious or overwhelmed client back into the present through the senses."},
  {name:"Yesterday's Protocol",lineage:"Narrative",category:"Method",practiced:false,topic:"Life & Mindfulness",note:"Open narrative on micro-moments of yesterday",desc:"The client reports unprepared micro-moments from the previous day, raw and without explanation or evaluation. The coach asks only for detail: what colour, what smell, what exact words. An experiment in the difference between open and closed narrative."},
  {name:"The Turning Point of My Life",lineage:"Narrative",category:"Method",practiced:true,topic:"Life & Mindfulness",note:"Also known as That Was My Salvation",desc:"The client tells the story of a turning point in their life while the coach holds the unity of place and time, asking only for concrete detail, never for interpretation. The moment is imagined together and experienced as narrative rather than recalled as memory."},

  // ================= METHODS — CHANGE & TRANSITION =================
  {name:"Motivational Interviewing",category:"Method",practiced:false,topic:"Change",note:"Evokes the client's own motivation",desc:"Based on Miller and Rollnick. A conversation style that evokes the client's own reasons for change rather than persuading them. Particularly effective when the client is ambivalent or resistant."},
  {name:"House of Change (Four Rooms of Change)",category:"Method",practiced:false,topic:"Change",note:"Diagnose which room the client is in",desc:"Based on Janssen. A four-room model (contentment, denial, confusion, renewal) mapping the emotional stages of change. Identifies where the client or team is stuck and what support is needed."},
  {name:"Four-Step Model",category:"Method",practiced:false,topic:"Change",note:"Four courage quadrants",desc:"Based on Sonja Radatz. Explores four types of courage: to change, to preserve, to combine old and new, and to try something entirely new. Powerful when a client is stuck between staying and leaving."},
  {name:"The Bridge Model",category:"Method",practiced:true,topic:"Change",note:"Ending, neutral zone, new beginning",desc:"Based on William Bridges. Distinguishes change (external) from transition (internal), mapping three phases. Useful when a client is grieving a loss while needing to move forward."},
  {name:"Change Management Model (I Want / Can / Must)",category:"Method",practiced:false,topic:"Change",note:"Checks will, ability, and obligation",desc:"Checks three conditions for sustainable action: whether the client truly wants the goal, whether they believe they can achieve it, and whether external conditions allow it. Misalignment in any predicts failure."},
  {name:"Leave It / Live It / Change It",category:"Method",practiced:false,topic:"Change",note:"Three responses to an unresolved situation",desc:"For situations causing frustration or stuck energy. The client chooses between leaving the situation, accepting and living with it fully, or committing to actively changing it. Stops the costly middle ground of resisting without acting."},
  {name:"Hero's Journey",lineage:"Narrative",category:"Method",practiced:false,topic:"Change",note:"The monomyth as a frame for transition",desc:"Joseph Campbell's universal story pattern across three phases: separation, initiation, return. Reframes a challenge as a necessary trial and moves the client from passive subject of circumstance to active author of their own story."},

  // ================= METHODS — DECISIONS & PRIORITISATION =================
  {name:"The Odyssey Plan",category:"Method",practiced:false,topic:"Decisions",note:"Three different five-year paths",desc:"From Designing Your Life by Burnett and Evans. The client sketches three distinct possible paths for the next five years: the one they are on, an alternative they have considered, and a wildcard they have never seriously entertained."},
  {name:"10-10-10 Rule",category:"Method",practiced:false,topic:"Decisions",note:"Three time horizons on one decision",desc:"Suzy Welch's framework: how will I feel about this in ten minutes, ten months, and ten years? Separates short-term emotional reaction from longer-term values and consequences."},
  {name:"Inner Team",category:"Method",practiced:true,topic:"Decisions",note:"Gives voice to inner parts",desc:"Models the psyche as a team of inner figures. Each part gets a voice, revealing the internal conflict behind the client's ambivalence."},
  {name:"The Eisenhower Matrix",category:"Method",practiced:true,topic:"Decisions",note:"Urgent vs important",desc:"A two-axis grid separating tasks into four quadrants. Cuts through overwhelm and helps the client see what truly matters versus what only feels urgent."},
  {name:"SMART Goals",category:"Method",practiced:true,topic:"Decisions",note:"Converts intentions to commitments",desc:"Turns a vague intention into a specific, measurable, achievable, relevant, time-bound commitment. Used at the end of sessions to anchor the next step."},

  // ================= METHODS — STUCK =================
  {name:"The Wonder Wheel",category:"Method",practiced:false,topic:"Stuck",note:"Connects values to intrinsic motivation",desc:"Based on Maja Storch. Connects a desired goal to the client's core values and somatic felt sense. A goal only generates sustained motivation when rooted in something they deeply care about."},
  {name:"Fear Setting",category:"Method",practiced:true,topic:"Stuck",note:"Maps worst-case scenarios systematically",desc:"Based on Tim Ferriss. Maps the worst case in detail, evaluates how likely and survivable it is, and weighs it against the cost of inaction. Turns vague fear into a manageable calculation."},
  {name:"Associative Writing",category:"Method",practiced:false,topic:"Stuck",note:"Sentence stems bypass the analytical mind",desc:"The client completes sentence stems in writing for two minutes each without editing or judging. Moves from present observation to past learning to future imagination, closing with a meta discussion."},
  {name:"Circle of Influence",category:"Method",practiced:false,topic:"Stuck",note:"What you control vs what you cannot",desc:"Distinguishes the circle of concern (everything that worries the client) from the circle of influence (where they can actually act). Redirects energy toward what is actionable."},
  {name:"Pattern Analysis",category:"Method",practiced:false,topic:"Stuck",note:"Names and explores recurring patterns",desc:"Coach and client identify a recurring pattern in behaviour, relationships, or decisions. The pattern is named, its origin explored, its function examined. Awareness is the first step to change."},
  {name:"Human Scale Development",category:"Method",practiced:false,topic:"Stuck",note:"Nine fundamental human needs",desc:"Based on Manfred Max-Neef. Nine fundamental needs: subsistence, protection, affection, understanding, participation, leisure, creation, identity, freedom. Helps the client see which needs are unmet beneath the surface want."},
  {name:"Circle of Experience",lineage:"Gestalt",category:"Method",practiced:false,topic:"Stuck",note:"Seven stages from sensation to withdrawal",desc:"Perls, Zinker, and Nevis. Sensation, awareness, mobilisation, action, contact, satisfaction, withdrawal. A healthy person flows through; a stuck client is interrupting the cycle at a specific point. Naming where the block sits is the work."},
  {name:"Name Changed By The Editors",lineage:"Narrative",category:"Method",practiced:true,topic:"Stuck",note:"What if it was a novel?",desc:"The client gives themselves a pseudonym and describes their problem in the third person, as a journalistic story. Distance from the material and from the person experiencing it. Questions cover intention, obstacle, headline, and the surprising twist."},

  // ================= METHODS — RELATIONSHIP & COMMUNICATION =================
  {name:"Systemic Constellations",category:"Method",practiced:true,topic:"Relationships",note:"Spatial mapping of people and forces",desc:"Uses physical figures or objects to represent people, roles, or forces in the client's system. The client arranges them spatially and explores the dynamics. Surfaces patterns that words alone do not reach."},
  {name:"Expectation Carousel",category:"Method",practiced:false,topic:"Relationships",note:"Surfaces group expectations visually",desc:"Participants rotate around stations writing their expectations, concerns, and hopes. Surfaces hidden assumptions and misalignments before a workshop or team process begins."},
  {name:"Transactional Analysis",category:"Method",practiced:false,topic:"Relationships",note:"Parent, Adult, Child ego states",desc:"Based on Eric Berne. Describes communication between three ego states. Used to identify which state is driving a client's reactions in conflict or relationship patterns."},
  {name:"I-Messages",category:"Method",practiced:false,topic:"Relationships",note:"Speaking from your own experience",desc:"The client expresses feelings and needs from their own experience (I feel, when, because, and I need) rather than accusing (you always). Reduces defensiveness and opens dialogue."},
  {name:"Nonviolent Communication (NVC)",category:"Method",practiced:false,topic:"Relationships",note:"Observation, feeling, need, request",desc:"Based on Marshall Rosenberg. Four steps: observe without judgment, name the feeling, identify the underlying need, make a clear request. Helps clients express themselves and hear others without blame."},

  // ================= METHODS — CONFLICT =================
  {name:"The Iceberg Model",category:"Method",practiced:true,topic:"Conflict",note:"Visible behaviour, invisible beliefs",desc:"Distinguishes visible behaviours from the invisible beliefs, values, and identity that drive them. Used to explore why insight alone does not produce change."},
  {name:"Meta-Mirror: Taking Perspective",category:"Method",practiced:false,topic:"Conflict",note:"Adds an observer meta-position",desc:"A perceptual positions exercise. The client steps into their own perspective, the other person's, then an observer position. Reveals the pattern from outside the conflict."},
  {name:"Exploration of Different Perspectives",category:"Method",practiced:false,topic:"Conflict",note:"One situation, multiple lenses",desc:"Examines a situation through the client's view, other stakeholders' views, a neutral observer's view, and a future self's view. Breaks fixed perspective and opens new options."},
  {name:"Drama Triangle",category:"Method",practiced:false,topic:"Conflict",note:"Persecutor, Victim, Rescuer",desc:"Based on Stephen Karpman. Identifies three dysfunctional roles in conflict. The client identifies which they occupy, how they move between them, and how to step off the triangle entirely."},
  {name:"Four Perspectives for Conflict",category:"Method",practiced:false,topic:"Conflict",note:"Floor exercise: judgment to needs to empathy",desc:"A physical floor exercise using four markers: outer judgment, self-blame, own needs and feelings, and the other person's needs and feelings. Breaks the judgment-blame cycle."},
  {name:"Interview With The Internalised Other",lineage:"Narrative",category:"Method",practiced:false,topic:"Conflict",note:"Inspired by David Epston",desc:"The client slips into the role of the other person, often moving to another chair, and is interviewed by the coach about the shared situation. Examines the client's own construction of the other and the power that construction holds."},
];

const topicOrder = ["Career","Leadership","Roles & Identity","Life & Mindfulness","Change","Decisions","Stuck","Relationships","Conflict"];
const topicSubtitles = {
  "Career":"Work, fit, positioning, growth, purpose.",
  "Leadership":"Leading others, reading organisations, leadership as practice.",
  "Roles & Identity":"Role, self-concept, values, mindset, self-awareness.",
  "Life & Mindfulness":"Life, energy, regulation, balance, biography, presence.",
  "Change":"Transitions, ambivalence, moving from one state to another.",
  "Decisions":"Choosing, prioritising, weighing options, decision paralysis.",
  "Stuck":"Blocked or looping, needing distance or a new angle.",
  "Relationships":"Relational and systemic dynamics between people.",
  "Conflict":"Disagreement, friction, difficult conversations, perspective work.",
};
const craftSubtitles = {
  "Process":"The atomic skills of coaching.",
  "Tools":"Physical or visual aids.",
  "Approaches":"Schools of practice with their own theory and lineage.",
  "Session Structures":"Procedural architectures for running a session or an engagement.",
};
const topics = ["All", ...topicOrder];

const coachingArcs = {
  career:{meta:{h1:"Finding",em:"Direction",sub:"Work, fit, positioning and purpose, organised by coaching phase"},phases:[
    {phase:"Exploration & Awareness",items:["Wheel of Life","Life Line","Sweet Spot Analysis","Talent Exercise"]},
    {phase:"Identity & Purpose",items:["Role Model Reflection","Career Framework","The Golden Circle: The Why","The Role Compass","Inner Team"]},
    {phase:"Transition & Change",items:["House of Change (Four Rooms of Change)","The Bridge Model","Four-Step Model","Fear Setting","Change Management Model (I Want / Can / Must)"]},
    {phase:"Role Clarity & Performance",items:["The Role Analysis","Position Determination with the Base Triad","Leadership Maps","The Business as a Separate Entity","SMART Goals"]},
    {phase:"Motivation & Resistance",items:["Motivational Interviewing","Solution-Focused Approach","Zurich Resource Model","Hard Questions"]},
  ]},
  life:{meta:{h1:"Restoring",em:"Balance",sub:"Energy, regulation, biography and presence"},phases:[
    {phase:"Body & Energy",items:["Wheel of Life","Somatic Observation","Breathing / Meditation","5-4-3-2-1 Grounding","The Energy Audit","Zurich Resource Model"]},
    {phase:"Values & Core Needs",items:["Love, Freedom & Safety Triangle","Values Hierarchy Work","Position Determination with the Base Triad","Human Scale Development"]},
    {phase:"Biography & Story",items:["Life Line","The Turning Point of My Life","Yesterday's Protocol","Associative Writing"]},
    {phase:"Balance & Transitions",items:["House of Change (Four Rooms of Change)","The Bridge Model","Four-Step Model","The Wonder Wheel"]},
  ]},
  changeDecisions:{meta:{h1:"Navigating",em:"Change",sub:"Weighing options, moving through transition, breaking the loop"},phases:[
    {phase:"Naming the Stuck Point",items:["Pattern Analysis","The Iceberg Model","Circle of Influence","Circle of Experience","Three Zones of Learning","Name Changed By The Editors"]},
    {phase:"Mapping the Change",items:["House of Change (Four Rooms of Change)","The Bridge Model","Four-Step Model","Leave It / Live It / Change It","Hero's Journey"]},
    {phase:"Weighing the Decision",items:["10-10-10 Rule","The Odyssey Plan","Inner Team","Fear Setting"]},
    {phase:"Committing to Action",items:["Change Management Model (I Want / Can / Must)","Motivational Interviewing","SMART Goals","The Eisenhower Matrix"]},
  ]},
  conflict:{meta:{h1:"Working Through",em:"Conflict",sub:"Mapping, understanding, and resolving friction between people"},phases:[
    {phase:"Mapping the Conflict",items:["Drama Triangle","Transactional Analysis","Pattern Analysis","The Iceberg Model"]},
    {phase:"Understanding Positions & Needs",items:["Four Perspectives for Conflict","Inner Team","Values Hierarchy Work","Systemic Questions","Interview With The Internalised Other"]},
    {phase:"Shifting Perspective",items:["Meta-Mirror: Taking Perspective","Exploration of Different Perspectives","Systemic Constellations","Reframing"]},
    {phase:"Moving Forward",items:["Conflict Facilitation","Motivational Interviewing","Solution-Focused Approach","I-Messages","Nonviolent Communication (NVC)"]},
  ]},
  leadership:{meta:{h1:"Building",em:"Authority",sub:"Reading the system, seeing yourself in it, and leading people through it"},phases:[
    {phase:"Reading the System",items:["Three Sides of the Organisation","Systemic Questions","Expectation Carousel","Circle of Influence"]},
    {phase:"Seeing Yourself Clearly",items:["Johari Window","Role Model Reflection","Leadership Maps","The Role Expectations Scaling Analysis","Growth vs. Fixed Mindset"]},
    {phase:"Leading People",items:["Situational Leadership","Push-Pull Coaching Continuum","Three Zones of Learning","I-Messages"]},
    {phase:"Sustaining the Practice",items:["Skill Stacking","The Energy Audit","Head / Heart / Hand","SMART Goals"]},
  ]},
};

let currentStatus="all", currentTopic="All", currentArc=null, currentCat=null, currentLin=null;

function clearAllBtns(){
  document.querySelectorAll(".arc-btn,.cat-btn,.lin-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".sit-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector(".sit-btn[data-sit='All']").classList.add("active");
}

function setStatus(val,btn){
  currentStatus=val;
  document.querySelectorAll(".toggle-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}
function setTopic(val){
  currentTopic=val; currentArc=null; currentCat=null; currentLin=null;
  document.querySelectorAll(".arc-btn,.cat-btn,.lin-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".sit-btn").forEach(b=>b.classList.toggle("active",b.dataset.sit===val));
  render();
}
function setCat(val,btn){
  const wasActive = currentCat===val;
  currentCat=null; currentArc=null; currentLin=null; currentTopic="All";
  clearAllBtns();
  if(!wasActive){ currentCat=val; btn.classList.add("active"); }
  render();
}
function setLin(val,btn){
  const wasActive = currentLin===val;
  currentLin=null; currentArc=null; currentCat=null; currentTopic="All";
  clearAllBtns();
  if(!wasActive){ currentLin=val; btn.classList.add("active"); }
  render();
}
function setArc(val,btn){
  const wasActive = currentArc===val;
  currentArc=null; currentCat=null; currentLin=null; currentTopic="All";
  clearAllBtns();
  if(wasActive){ render(); return; }
  currentArc=val; btn.classList.add("active");
  renderArc(val);
}

function clearTopicHero(){ const h=document.getElementById("topic-hero"); if(h) h.remove(); }

function buildCard(m){
  const homeTag = m.topic ? m.topic : m.category;
  const linTag = m.lineage ? `<span class="card-tag lineage">${m.lineage}</span>` : '';
  return `<div class="card ${m.practiced?'':'learning'}">
    <div class="card-top"><span class="card-name">${m.name}</span><span class="card-badge">◎</span></div>
    <div class="card-note">${m.note}</div>
    <div class="card-desc">${m.desc}</div>
    <div class="card-tags"><span class="card-tag">${homeTag}</span>${linTag}</div>
  </div>`;
}

function renderStats(list,label){
  const p=list.filter(m=>m.practiced).length, l=list.filter(m=>!m.practiced).length;
  const text = label ? `${label}: ${list.length}` : `${list.length} methods`;
  document.getElementById("stats").innerHTML =
    `<span>${text}</span><span class="divider"></span><span class="stat-practiced">✓ ${p} practiced</span><span class="divider"></span><span class="stat-practiced">◎ ${l} to learn</span>`;
}

function section(label, sub, list){
  return `<div class="category-section">
    <div class="category-header"><div class="cat-dot"></div><span class="cat-label-text">${label}</span><div class="cat-line"></div><span class="cat-count">${list.length}</span></div>
    ${sub?`<div class="cat-sub">${sub}</div>`:''}
    <div class="cards-grid">${list.map(buildCard).join('')}</div>
  </div>`;
}

function renderArc(type){
  document.getElementById("main-view").style.display="none";
  document.getElementById("arc-view").style.display="block";
  clearTopicHero();
  const arc=coachingArcs[type];
  document.getElementById("stats").innerHTML=`<span>${arc.meta.h1} ${arc.meta.em}</span>`;
  document.getElementById("arc-view").innerHTML=`
    <div class="arc-hero"><h2>${arc.meta.h1}<br><em>${arc.meta.em}</em></h2><p>${arc.meta.sub}</p><p class="guide">Within a phase, methods are options to choose from rather than a sequence to run in full.</p></div>
    <div class="arc-content">
      ${arc.phases.map((p,i)=>`
        <div class="arc-phase-block">
          <div class="arc-phase-header"><div class="phase-num">0${i+1}</div><div class="phase-label">${p.phase}</div><div class="phase-line"></div></div>
          <div class="arc-grid">
            ${p.items.map(nm=>{
              const m=methods.find(x=>x.name===nm);
              if(!m) return '';
              return `<div class="arc-card${m.practiced?'':' learning'}">
                <div class="arc-card-top"><h3>${m.name}</h3><span class="card-badge">◎</span></div>
                <div class="arc-note">${m.note}</div>
                <div class="arc-desc">${m.desc}</div>
              </div>`;
            }).join('')}
          </div>
        </div>`).join('')}
    </div>`;
}

function render(){
  if(currentArc){ renderArc(currentArc); return; }
  document.getElementById("main-view").style.display="block";
  document.getElementById("arc-view").style.display="none";
  clearTopicHero();

  const search=document.getElementById("search").value.toLowerCase();
  const okSearch=m=>!search||m.name.toLowerCase().includes(search)||m.note.toLowerCase().includes(search)||m.desc.toLowerCase().includes(search);
  const okStatus=m=>currentStatus==="all"||(currentStatus==="practiced"&&m.practiced)||(currentStatus==="learning"&&!m.practiced);
  const base=methods.filter(m=>okStatus(m)&&okSearch(m));
  const grid=document.getElementById("grid");


  // Lineage view — all marked items, split craft vs methods
  if(currentLin){
    const list=base.filter(m=>m.lineage===currentLin);
    renderStats(list,currentLin);
    if(!list.length){ grid.innerHTML='<div class="empty">Nothing matches this filter</div>'; return; }
    const craft=list.filter(m=>m.category!=="Method");
    const meth=list.filter(m=>m.category==="Method");
    grid.innerHTML=(craft.length?section("Category Layer","Skills and structures carrying this lineage.",craft):'')
                 +(meth.length?section("Methods","Client-facing methods carrying this lineage.",meth):'');
    return;
  }

  // Category layer view
  if(currentCat){
    const list=base.filter(m=>m.category===currentCat);
    renderStats(list,currentCat);
    if(!list.length){ grid.innerHTML='<div class="empty">Nothing matches this filter</div>'; return; }
    grid.innerHTML=section(currentCat,craftSubtitles[currentCat]||'',list);
    return;
  }

  // ALL / single-topic view — Methods only
  const methodCards=base.filter(m=>m.category==="Method"&&(currentTopic==="All"||m.topic===currentTopic));
  if(currentTopic!=="All"){
    const hero=document.createElement("div");
    hero.id="topic-hero"; hero.className="arc-hero";
    hero.innerHTML=`<h2>${currentTopic}</h2><p>${topicSubtitles[currentTopic]||''}</p>`;
    document.getElementById("main-view").parentNode.insertBefore(hero,document.getElementById("main-view"));
  }
  renderStats(methodCards,currentTopic==="All"?"":currentTopic);
  if(!methodCards.length){ grid.innerHTML='<div class="empty">Nothing matches this filter</div>'; return; }
  const shown=currentTopic==="All"?topicOrder:[currentTopic];
  grid.innerHTML=shown.map(t=>{
    const inT=methodCards.filter(m=>m.topic===t);
    return inT.length?section(t,topicSubtitles[t],inT):'';
  }).join('');
}

const sitFilters=document.getElementById("sit-filters");
topics.forEach(s=>{
  const b=document.createElement("button");
  b.className="sit-btn"+(s==="All"?" active":"");
  b.dataset.sit=s; b.textContent=s;
  b.onclick=()=>setTopic(s);
  sitFilters.appendChild(b);
});

render();
</script>
</body>
</html>
